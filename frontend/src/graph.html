<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Graph Intelligence</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/graph.css">

</head>

<body>

<div class="container-fluid py-4">

<h2 class="mb-4">

<i class="bi bi-diagram-3-fill text-primary"></i>

Graph Intelligence Dashboard

</h2>

<!-- ================= SUMMARY ================= -->

<div class="row g-4 mb-4">

<div class="col-md-3">

<div class="graph-card">

<h6>Total Documents</h6>

<h2 id="docCount">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="graph-card">

<h6>Unique Applicants</h6>

<h2 id="applicantCount">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="graph-card">

<h6>Unique PANs</h6>

<h2 id="panCount">0</h2>

</div>

</div>

<div class="col-md-3">

<div class="graph-card">

<h6>Companies</h6>

<h2 id="companyCount">0</h2>

</div>

</div>

</div>

<!-- ================= NETWORK ================= -->

<div class="graph-box">

<h4>

<i class="bi bi-share-fill"></i>

Applicant Relationship Network

</h4>

<div id="networkGraph"></div>

</div>

<!-- ================= CHARTS ================= -->

<div class="row">

<div class="col-lg-6">

<div class="graph-box">

<h5>Risk Distribution</h5>

<canvas id="riskChart"></canvas>

</div>

</div>

<div class="col-lg-6">

<div class="graph-box">

<h5>OCR Confidence</h5>

<canvas id="ocrChart"></canvas>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script type="module"
src="js/graph.js"></script>

</body>

</html>
