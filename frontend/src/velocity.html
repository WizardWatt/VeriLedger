<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Velocity Analysis</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
        href="css/velocity.css">

</head>

<body>

<div class="container-fluid px-5 py-4">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="page-title">

                <i class="bi bi-speedometer2 me-2"></i>

                Velocity Analysis

            </h1>

            <p class="page-subtitle">

                Monitor repeated document submissions and detect suspicious applicant behaviour.

            </p>

        </div>

        <a href="index.html"
            class="btn btn-primary btn-lg shadow-sm rounded-4 px-4">

            <i class="bi bi-arrow-left"></i>

            Back to Dashboard

        </a>

    </div>

    <!-- Summary Cards -->

    <div id="summaryCards" class="row g-4 mb-5">

    </div>

    <!-- Velocity Table -->

    <div class="main-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2>

                    <i class="bi bi-people-fill me-2"></i>

                    Applicant Velocity Report

                </h2>

                <small>

                    Applicants analysed based on submission frequency.

                </small>

            </div>

            <span class="badge bg-primary fs-6">

                Live Analysis

            </span>

        </div>

        <div class="table-responsive">

            <div id="velocityTable">

                <div class="text-center py-5">

                    <div class="spinner-border text-primary mb-3"></div>

                    <h5>

                        Loading Velocity Data...

                    </h5>

                </div>

            </div>

        </div>

    </div>

</div>

<script type="module" src="js/velocity.js"></script>

</body>

</html>
